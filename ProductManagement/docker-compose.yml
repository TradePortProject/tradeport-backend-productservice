services:
  productservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: productservice
    ports:
      - "3016:80"   # map host 3016 → container 80
    environment:
      - AWS_REGION=ap-southeast-1
      - ASPNETCORE_URLS=http://+:80
    networks:
      - my_network
    volumes:
      - "C:/wwwroot/uploads/images:/app/wwwroot/uploads/images"

networks:
  my_network:
    external: true
